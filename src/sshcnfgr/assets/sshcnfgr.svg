<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="SSHCnfgr Icon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f2937"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile background -->
  <rect x="14" y="14" width="228" height="228" rx="48" fill="url(#bg)" stroke="url(#border)" stroke-width="6"/>

  <!-- Subtle top window bar -->
  <path d="M22 62 C22 36 36 22 62 22 L194 22 C220 22 234 36 234 62 L234 72 L22 72 Z" fill="#0b1220" opacity="0.72"/>
  <circle cx="52" cy="47" r="7" fill="#f87171"/>
  <circle cx="76" cy="47" r="7" fill="#fbbf24"/>
  <circle cx="100" cy="47" r="7" fill="#34d399"/>

  <!-- Subtle config lines on top right of window bar -->
  <rect x="136" y="42" width="68" height="10" rx="5" fill="#334155"/>

  <!-- Terminal prompt chevron '>' -->
  <path d="M52 114 L88 140 L52 166" fill="none" stroke="url(#accent)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Prompt underscore '_' -->
  <line x1="98" y1="168" x2="132" y2="168" stroke="#38bdf8" stroke-width="13" stroke-linecap="round"/>

  <!-- Stylized SSH key badge on lower right -->
  <g transform="translate(132, 92)">
    <!-- Key bow (ring) -->
    <circle cx="48" cy="34" r="24" fill="none" stroke="url(#keyGrad)" stroke-width="13"/>
    <circle cx="48" cy="34" r="7" fill="#0f172a"/>
    <!-- Key shaft & teeth -->
    <path d="M48 58 L48 112 M48 86 L66 86 M48 104 L62 104" fill="none" stroke="url(#keyGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Subtle bottom host-list bars -->
  <rect x="48" y="198" width="76" height="10" rx="5" fill="#38bdf8" opacity="0.45"/>
  <rect x="134" y="198" width="32" height="10" rx="5" fill="#34d399" opacity="0.65"/>
</svg>
