[project]
name = "sshcnfgr"
version = "1.0.0"
description = "TUI, optional Qt6 GUI, and CLI to manage OpenSSH host configs from a single TOML file"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Baer", email = "thomas.baer@tbaer.de" }]
maintainers = [{ name = "Thomas Baer", email = "thomas.baer@tbaer.de" }]
keywords = ["ssh", "openssh", "tui", "textual", "qt", "pyside6", "cli", "config", "devops"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = [
  "textual>=6.0.0",
  "click>=8.1.7",
  "loguru>=0.7.3",
  "tomli-w>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/thomsbe/SSHCnfgr"
Repository = "https://github.com/thomsbe/SSHCnfgr"
Issues = "https://github.com/thomsbe/SSHCnfgr/issues"
Changelog = "https://github.com/thomsbe/SSHCnfgr/blob/main/CHANGELOG.md"

[project.optional-dependencies]
qt = [
  "PySide6-Essentials>=6.8.0",
]
dev = [
  "build>=1.2.2",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "twine>=5.1.1",
]

[project.scripts]
sshcnfgr = "sshcnfgr.cli:cli"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/SECURITY.md",
  "/CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sshcnfgr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
